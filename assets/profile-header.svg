  <text class="primary" x="58" y="151" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="750" letter-spacing="-3">Building useful systems.</text>
  <text class="secondary" x="62" y="203" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500">Computer Science · Software Engineering · Technical Analysis</text>

